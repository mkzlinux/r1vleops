name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Site · tests, types, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  godot:
    name: Godot campus · tests + web export
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.5.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Export web build (downloads Godot on first run)
        run: npm run godot:export
      - name: Headless Godot tests
        run: npm run godot:test
      - uses: actions/upload-artifact@v4
        with:
          name: ops-app-web-export
          path: public/ops-app
          retention-days: 14
